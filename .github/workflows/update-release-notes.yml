name: Update NPC AI Talk Release Notes

on:
  push:
    branches: [ main ]
    paths:
      - 'RELEASE_NOTES_v1.4.0.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update v1.4.0 release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "NPC AI Talk v1.4.0 - ACTION JACKSON" \
            --notes-file RELEASE_NOTES_v1.4.0.md
