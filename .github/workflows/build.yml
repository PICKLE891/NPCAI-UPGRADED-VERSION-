name: Build NPC AI Talk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and extract NPC AI Talk source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source/parts/part*.txt" | Sort-Object Name
          if ($parts.Count -lt 1) { throw "Source parts were not found." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("source.zip", $bytes)
          Expand-Archive -Path "source.zip" -DestinationPath "work" -Force
          if (!(Test-Path "work/NpcAiTalk.csproj")) { throw "Source archive did not extract correctly." }

      - name: Apply RAGE SDK compatibility fixes
        shell: pwsh
        working-directory: work
        run: |
          $client = "src\OpenAiNpcClient.cs"
          $text = Get-Content $client -Raw
          $text = $text.Replace("private static string BuildSystemPrompt", "private string BuildSystemPrompt")
          Set-Content $client $text -Encoding UTF8

          $backup = "src\BackupAutonomy.cs"
          $text = Get-Content $backup -Raw
          $text = $text.Replace("Dictionary<int, OfficerState>", "Dictionary<PoolHandle, OfficerState>")
          $text = $text.Replace("new Dictionary<int, OfficerState>()", "new Dictionary<PoolHandle, OfficerState>()")
          $text = $text.Replace("int handle = officer.Handle;", "PoolHandle handle = officer.Handle;")
          $text = $text.Replace("HashSet<int> live", "HashSet<PoolHandle> live")
          $text = $text.Replace("new HashSet<int>(", "new HashSet<PoolHandle>(")
          $text = $text.Replace("List<int> remove", "List<PoolHandle> remove")
          $text = $text.Replace("new List<int>()", "new List<PoolHandle>()")
          $text = $text.Replace("KeyValuePair<int, OfficerState>", "KeyValuePair<PoolHandle, OfficerState>")
          $text = $text.Replace("foreach (int key in remove)", "foreach (PoolHandle key in remove)")
          Set-Content $backup $text -Encoding UTF8

          $proj = "NpcAiTalk.csproj"
          $text = Get-Content $proj -Raw
          $text = $text.Replace("AnyCPU", "x64")
          Set-Content $proj $text -Encoding UTF8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore RAGE Plugin Hook SDK
        shell: pwsh
        working-directory: work
        run: |
          nuget install RagePluginHook -Version 1.124.0 -OutputDirectory packages -NonInteractive
          $dll = Get-ChildItem -Path "packages\RagePluginHook.1.124.0" -Filter "RagePluginHook.dll" -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw "RAGE Plugin Hook DLL was not found in the NuGet package." }
          New-Item -ItemType Directory -Force "packages\RagePluginHook.1.124.0\SDK" | Out-Null
          if ($dll.FullName -ne (Join-Path (Get-Location) "packages\RagePluginHook.1.124.0\SDK\RagePluginHook.dll")) {
            Copy-Item $dll.FullName "packages\RagePluginHook.1.124.0\SDK\RagePluginHook.dll" -Force
          }
          Write-Host "Using RAGE Plugin Hook SDK: packages\RagePluginHook.1.124.0\SDK\RagePluginHook.dll"

      - name: Build plugin
        shell: pwsh
        working-directory: work
        run: |
          msbuild NpcAiTalk.csproj /t:Clean,Build /p:Configuration=Release /p:Platform=x64
          if (!(Test-Path "bin\Release\NpcAiTalk.dll")) { throw "NpcAiTalk.dll was not produced." }

      - name: Create install package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_artifact | Out-Null
          Copy-Item "work\bin\Release\NpcAiTalk.dll" "build_artifact\NpcAiTalk.dll"
          Copy-Item "work\NpcAiTalk.ini" "build_artifact\NpcAiTalk.ini"
          Copy-Item "README.md" "build_artifact\README.md"
          Compress-Archive -Path "build_artifact\*" -DestinationPath "NPC_AI_TALK_ACTION_JACKSON.zip" -Force

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: NPC-AI-TALK-ACTION-JACKSON
          path: NPC_AI_TALK_ACTION_JACKSON.zip
          if-no-files-found: error
